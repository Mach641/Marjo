<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4ead8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Notre carnet de voyage</title>
  <script>
    (() => {
      const isDebugInstall = new URLSearchParams(location.search).get("debug") === "1";
      const manifest = document.createElement("link");
      manifest.rel = "manifest";
      manifest.href = isDebugInstall ? "manifest-debug.webmanifest?v=1.4.2" : "manifest.webmanifest?v=1.4.2";
      document.head.append(manifest);
    })();
  </script>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192-v1.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-v1.png" />
  <link rel="stylesheet" href="styles.css?v=1.4.2" />
</head>
<body>
  <div class="weather" aria-hidden="true">
    <span class="weather__rain"></span>
    <span class="weather__sun">☀</span>
    <span class="weather__rainbow">⌒</span>
  </div>

  <header class="site-header" hidden>
    <div class="progress" aria-label="Progression du voyage">
      <span id="progressLabel">Le carnet</span>
      <span class="progress__track"><span id="progressBar"></span></span>
    </div>
    <span class="illustration-count" id="illustrationCount" hidden>Souvenirs</span>
  </header>

  <main id="app" class="app" aria-live="polite">
    <section class="paper-card loading-card">
      <p>Le carnet s’ouvre…</p>
    </section>
  </main>

  <aside id="debugPanel" class="debug-panel" hidden aria-label="Outils de test">
    <details>
      <summary><span id="debugVersion"></span> · Test</summary>
      <label for="debugStep">Aller à une étape</label>
      <select id="debugStep"></select>
      <div class="debug-actions">
        <button id="debugGo" type="button">Ouvrir</button>
        <button id="debugUnlock" type="button">Tout débloquer</button>
        <button id="debugOnboarding" type="button">Rejouer l’intro</button>
        <button id="debugBook" type="button">Carnet fermé</button>
        <button id="debugWait" class="button-wide" type="button">Simuler une attente</button>
      </div>
      <label for="debugChallengeOneRule">Défi 1 — règle et écran</label>
      <div class="debug-challenge-one">
        <select id="debugChallengeOneRule" aria-label="Règle du défi 1">
          <option value="1">Règle 1</option><option value="2">Règle 2</option><option value="3">Règle 3</option>
          <option value="4">Règle 4</option><option value="5">Règle 5</option><option value="6">Règle 6</option>
        </select>
        <select id="debugChallengeOneStage" aria-label="Écran du défi 1">
          <option value="intro">Introduction</option><option value="doors">Portes initiales</option>
          <option value="level1">Dessin niveau 1</option><option value="level2">Dessin niveau 2</option><option value="level3">Dessin niveau 3</option>
          <option value="hint">Indice</option><option value="speak">Réponse orale</option><option value="reward">Révélation</option>
          <option value="one">Une porte ouverte</option><option value="five">Cinq portes ouvertes</option><option value="six">Six portes ouvertes</option>
        </select>
        <button id="debugChallengeOneApply" type="button">Tester</button>
      </div>
      <label for="debugMemories">Souvenirs débloqués</label>
      <div class="debug-inline">
        <select id="debugMemories"></select>
        <button id="debugApplyMemories" type="button">Simuler</button>
      </div>
      <label for="debugDisplayMode">Contexte d’affichage</label>
      <div class="debug-inline">
        <select id="debugDisplayMode">
          <option value="auto">Réel</option>
          <option value="pwa">PWA</option>
          <option value="browser">Safari</option>
        </select>
        <button id="debugApplyDisplay" type="button">Appliquer</button>
      </div>
      <div class="debug-actions">
        <button id="debugRefresh" class="button-refresh" type="button">Actualiser la webapp</button>
        <button id="debugReset" class="button-danger" type="button">Reset complet</button>
      </div>
      <p>Horaires, GPS et timers longs sont automatiquement ignorés.</p>
    </details>
  </aside>

  <noscript>Ce carnet a besoin de JavaScript pour raconter son histoire.</noscript>
  <script type="module" src="script.js?v=1.4.2"></script>
</body>
</html>
